name: CI

# La CI es la puerta de cada entrega (D171): una PR entra en main solo con todo en verde.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.3: mínimo del proyecto. 8.5: la que usa Herd en local.
        php: ['8.3', '8.5']
    name: Calidad y tests · PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # imagick: análisis de los PNG de los clientes y maquetas (fase 4).
          extensions: mbstring, intl, pdo_sqlite, bcmath, gd, zip, imagick
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formato del código (Pint)
        run: vendor/bin/pint --test

      # Informativo hasta tener la línea base (phpstan-baseline.neon): después, obligatorio.
      - name: Análisis estático (Larastan)
        id: larastan
        if: matrix.php == '8.3'
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Mientras no haya línea base: se genera aquí y se deja para descargar (no se puede generar en local).
      - name: Línea base de Larastan
        if: matrix.php == '8.3' && steps.larastan.outcome == 'failure'
        run: |
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G --generate-baseline=phpstan-baseline.neon --allow-empty-baseline || true
          echo '-----LINEA-BASE-----'; cat phpstan-baseline.neon; echo '-----FIN-LINEA-BASE-----'

      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3' && steps.larastan.outcome == 'failure'
        with:
          name: phpstan-baseline
          path: phpstan-baseline.neon

      - name: Tests (SQLite)
        run: php artisan test

  mariadb:
    # La base de datos del servidor, con la configuración estricta de XAMPP (D59).
    runs-on: ubuntu-latest
    name: Tests en MariaDB estricta
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_DATABASE: pruebas
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip, imagick
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      # Las copias de seguridad usan mariadb-dump (el mysqldump 8 del runner no sirve con MariaDB).
      - name: Cliente de MariaDB
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          # El cliente nuevo exige SSL y la MariaDB 10.4 del servicio no lo tiene (solo en esta máquina de la CI).
          printf '[client]\nskip-ssl\n' > ~/.my.cnf

      # En la 10.4 «explicit_defaults_for_timestamp» ya está apagado (como en XAMPP) y no se puede cambiar.
      - name: MariaDB como XAMPP
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';"
          mysql -h127.0.0.1 -uroot -proot -e "SELECT @@sql_mode, @@explicit_defaults_for_timestamp;"

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migraciones (subir, bajar y subir)
        env: { DB_CONNECTION: mariadb, DB_HOST: 127.0.0.1, DB_DATABASE: pruebas, DB_USERNAME: root, DB_PASSWORD: root }
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Tests (MariaDB)
        env: { DB_CONNECTION: mariadb, DB_HOST: 127.0.0.1, DB_DATABASE: pruebas, DB_USERNAME: root, DB_PASSWORD: root }
        run: php artisan test
